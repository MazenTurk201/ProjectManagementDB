<!DOCTYPE html>
<html lang="ar" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>{% block title %}ProjectFlow{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* تنسيق يخلي السايد بار جنب المحتوى */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #F6F8FA;
        }

        /* السايد بار واخد مساحته */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            height: 100vh;
        }

        /* المحتوى الرئيسي بياخد باقي الشاشة */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }
    </style>
</head>

<body class="dark">

    {% include 'components/sidebar.html' %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script>
        // دالة المودال العامة
        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (modal) { modal.style.display = show ? 'flex' : 'none'; document.body.style.overflow = show ? 'hidden' : 'auto'; }
        }
        // window.onclick = function(event) {
        //     const modal = document.getElementById('taskModal');
        //     const modal2 = document.getElementById('projectModal');
        //     if (event.target == modal) modal.style.display = "none";
        //     if (event.target == modal2) modal2.style.display = "none";
        // }
    </script>
</body>

</html>
