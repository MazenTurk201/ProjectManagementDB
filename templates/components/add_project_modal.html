<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
<link rel="stylesheet" href="styles.css">
<style>
    /* Reset and Base Styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --primary: #1664f3;
        --primary-dark: #0A2540;
        --accent: #00C49A;
        --background-light: #f5f6f8;
        --background-dark: #101622;
        --white: #ffffff;
        --black: #000000;
        --modal-bg-light: #ffffff;
        --modal-bg-dark: #182234;
        --text-primary-light: #111827;
        --text-primary-dark: #ffffff;
        --text-secondary-light: #374151;
        --text-secondary-dark: #d1d5db;
        --text-tertiary-light: #6b7280;
        --text-tertiary-dark: #9ca3af;
        --border-light: #e5e7eb;
        --border-dark: #314468;
        --input-bg-light: #f9fafb;
        --input-bg-dark: #101723;
        --hover-light: #f3f4f6;
        --hover-dark: rgba(255, 255, 255, 0.05);
        --error: #D73A49;
        --accent-light: rgba(0, 196, 154, 0.2);
        --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        --radius-sm: 0.25rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-full: 9999px;

        /* Select Dropdown Icon */
        --select-icon: url("data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724px%27 height=%2724px%27 fill=%27rgb(106,115,125)%27 viewBox=%270 0 256 256%27%3e%3cpath d=%27M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48,48A8,8,0,0,0,85.66,85.66Z%27%3e%3c/path%3e%3c/svg%3e");
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--background-light);
        color: var(--text-primary-light);
        min-height: 100vh;
    }

    body.dark {
        background-color: var(--background-dark);
        color: var(--text-primary-dark);
    }

    /* Create Project Container */
    .create-project-container {
        position: absolute;
        top: 0;
        display: none;
        min-height: 100vh;
        width: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }

    @media (min-width: 640px) {
        .create-project-container {
            padding: 1.5rem;
        }
    }

    /* Background Overlay */
    .modal-overlay {
        position: absolute;
        top: 0;
        display: none;
        z-index: 100;
        inset: 0;
        background-color: rgba(55, 65, 81, 0.5);
        backdrop-filter: blur(4px);
    }

    body.dark .modal-overlay {
        background-color: rgba(0, 0, 0, 0.6);
    }

    /* Modal Container */
    .modal-container {
        position: relative;
        width: 100%;
        max-width: 42rem;
        transform: none;
        border-radius: var(--radius-lg);
        background-color: var(--modal-bg-light);
        box-shadow: var(--shadow);
        transition: all 0.3s ease;
    }

    body.dark .modal-container {
        background-color: var(--modal-bg-dark);
    }

    /* Modal Header */
    .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.5rem;
        border-bottom: 1px solid var(--border-light);
    }

    body.dark .modal-header {
        border-bottom-color: var(--border-dark);
    }

    .modal-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-primary-light);
    }

    body.dark .modal-title {
        color: var(--text-primary-dark);
    }

    .close-btn {
        padding: 0.25rem;
        border-radius: var(--radius-full);
        color: var(--text-tertiary-light);
        background: none;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
    }

    .close-btn:hover {
        background-color: var(--hover-light);
    }

    .close-btn:focus {
        outline: none;
        box-shadow: 0 0 0 2px var(--primary-dark);
    }

    body.dark .close-btn {
        color: #90a5cb;
    }

    body.dark .close-btn:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }

    body.dark .close-btn:focus {
        box-shadow: 0 0 0 2px white;
    }

    .close-icon {
        font-size: 24px;
    }

    /* Modal Body */
    .modal-body {
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    /* Form Groups */
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-label {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-secondary-light);
    }

    body.dark .form-label {
        color: var(--text-primary-dark);
    }

    /* Form Inputs */
    .form-input {
        display: flex;
        width: 100%;
        min-width: 0;
        flex: 1;
        resize: none;
        overflow: hidden;
        border-radius: var(--radius-lg);
        color: var(--text-primary-light);
        border: 1px solid var(--border-light);
        background-color: var(--input-bg-light);
        height: 3rem;
        padding-left: 1rem;
        padding-right: 1rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: normal;
        outline: none;
        transition: all 0.2s;
    }

    .form-input::placeholder {
        color: var(--text-tertiary-light);
    }

    .form-input:focus {
        border-color: var(--primary-dark);
        box-shadow: 0 0 0 2px rgba(10, 37, 64, 0.5);
        outline: none;
    }

    body.dark .form-input {
        color: var(--text-primary-dark);
        border-color: var(--border-dark);
        background-color: var(--input-bg-dark);
    }

    body.dark .form-input::placeholder {
        color: #6A737D;
    }

    body.dark .form-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(0, 196, 154, 0.5);
    }

    /* Error Message */
    .error-message {
        font-size: 0.875rem;
        color: var(--error);
    }

    /* Textarea */
    .form-textarea {
        display: flex;
        width: 100%;
        min-width: 0;
        flex: 1;
        resize: vertical;
        overflow: hidden;
        border-radius: var(--radius-lg);
        color: var(--text-primary-light);
        border: 1px solid var(--border-light);
        background-color: var(--input-bg-light);
        min-height: 7rem;
        padding: 1rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: normal;
        outline: none;
        transition: all 0.2s;
    }

    .form-textarea::placeholder {
        color: var(--text-tertiary-light);
    }

    .form-textarea:focus {
        border-color: var(--primary-dark);
        box-shadow: 0 0 0 2px rgba(10, 37, 64, 0.5);
        outline: none;
    }

    body.dark .form-textarea {
        color: var(--text-primary-dark);
        border-color: var(--border-dark);
        background-color: var(--input-bg-dark);
    }

    body.dark .form-textarea::placeholder {
        color: #6A737D;
    }

    body.dark .form-textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(0, 196, 154, 0.5);
    }

    /* Form Row (Due Date & Status) */
    .form-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }

    @media (min-width: 768px) {
        .form-row {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* Date Input Wrapper */
    .date-input-wrapper {
        position: relative;
        display: flex;
        width: 100%;
        flex: 1;
        align-items: stretch;
    }

    .date-input {
        display: flex;
        width: 100%;
        min-width: 0;
        flex: 1;
        resize: none;
        overflow: hidden;
        border-radius: var(--radius-lg) 0 0 var(--radius-lg);
        color: var(--text-primary-light);
        border: 1px solid var(--border-light);
        background-color: var(--input-bg-light);
        height: 3rem;
        padding-left: 1rem;
        padding-right: 1rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: normal;
        outline: none;
        border-right: none;
        transition: all 0.2s;
    }

    .date-input::placeholder {
        color: var(--text-tertiary-light);
    }

    .date-input:focus {
        border-color: var(--primary-dark);
        box-shadow: 0 0 0 2px rgba(10, 37, 64, 0.5);
        outline: none;
    }

    body.dark .date-input {
        color: var(--text-primary-dark);
        border-color: var(--border-dark);
        background-color: var(--input-bg-dark);
    }

    body.dark .date-input::placeholder {
        color: #6A737D;
    }

    body.dark .date-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(0, 196, 154, 0.5);
    }

    .date-icon-container {
        color: var(--text-tertiary-light);
        display: flex;
        border: 1px solid var(--border-light);
        border-left: none;
        background-color: var(--input-bg-light);
        align-items: center;
        justify-content: center;
        padding-right: 0.75rem;
        border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
    }

    body.dark .date-icon-container {
        color: #90a5cb;
        border-color: var(--border-dark);
        background-color: var(--input-bg-dark);
    }

    .date-icon {
        font-size: 1.25rem;
    }

    /* Form Select */
    .form-select {
        display: flex;
        width: 100%;
        min-width: 0;
        flex: 1;
        resize: none;
        overflow: hidden;
        border-radius: var(--radius-lg);
        color: var(--text-primary-light);
        border: 1px solid var(--border-light);
        background-color: var(--input-bg-light);
        height: 3rem;
        padding-left: 1rem;
        padding-right: 2.5rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: normal;
        outline: none;
        cursor: pointer;
        background-image: var(--select-icon);
        transition: all 0.2s;
    }

    .form-select:focus {
        border-color: var(--primary-dark);
        box-shadow: 0 0 0 2px rgba(10, 37, 64, 0.5);
        outline: none;
    }

    body.dark .form-select {
        color: var(--text-primary-dark);
        border-color: var(--border-dark);
        background-color: var(--input-bg-dark);
        background-image: url("data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724px%27 height=%2724px%27 fill=%27rgb(144,165,203)%27 viewBox=%270 0 256 256%27%3e%3cpath d=%27M181.66,170.34a8,8,0,0,1,0,11.32l-48,48a8,8,0,0,1-11.32,0l-48-48a8,8,0,0,1,11.32-11.32L128,212.69l42.34-42.35A8,8,0,0,1,181.66,170.34Zm-96-84.68L128,43.31l42.34,42.35a8,8,0,0,0,11.32-11.32l-48-48a8,8,0,0,0-11.32,0l-48,48A8,8,0,0,0,85.66,85.66Z%27%3e%3c/path%3e%3c/svg%3e");
    }

    body.dark .form-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(0, 196, 154, 0.5);
    }

    /* Members Input Container */
    .members-input-container {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        padding: 0.625rem;
        width: 100%;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-light);
        background-color: var(--input-bg-light);
        transition: all 0.2s;
    }

    .members-input-container:focus-within {
        border-color: var(--primary-dark);
        box-shadow: 0 0 0 2px rgba(10, 37, 64, 0.5);
    }

    body.dark .members-input-container {
        border-color: var(--border-dark);
        background-color: var(--input-bg-dark);
    }

    body.dark .members-input-container:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(0, 196, 154, 0.5);
    }

    /* Member Tag */
    .member-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background-color: var(--accent-light);
        color: var(--accent);
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.25rem 0.625rem;
        border-radius: var(--radius-full);
    }

    .remove-member-btn {
        flex-shrink: 0;
        margin-right: -0.25rem;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .remove-icon {
        font-size: 1rem;
    }

    /* Members Input */
    .members-input {
        flex: 1;
        min-width: 150px;
        background-color: transparent;
        border: none;
        color: var(--text-primary-light);
        padding: 0.25rem;
        font-size: 1rem;
        outline: none;
    }

    .members-input::placeholder {
        color: var(--text-tertiary-light);
    }

    .members-input:focus {
        box-shadow: none;
        outline: none;
    }

    body.dark .members-input {
        color: var(--text-primary-dark);
    }

    body.dark .members-input::placeholder {
        color: #6A737D;
    }

    /* Modal Footer */
    .modal-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 1rem;
        padding: 1.5rem;
        border-top: 1px solid var(--border-light);
    }

    body.dark .modal-footer {
        border-top-color: var(--border-dark);
    }

    /* Buttons */
    .cancel-btn {
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-secondary-light);
        background-color: var(--white);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: all 0.2s;
    }

    .cancel-btn:hover {
        background-color: var(--hover-light);
    }

    .cancel-btn:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(156, 163, 175, 0.5);
    }

    body.dark .cancel-btn {
        color: var(--text-tertiary-dark);
        background-color: transparent;
        border-color: var(--border-dark);
    }

    body.dark .cancel-btn:hover {
        background-color: rgba(255, 255, 255, 0.05);
    }

    body.dark .cancel-btn:focus {
        box-shadow: 0 0 0 2px rgba(156, 163, 175, 0.5);
    }

    .create-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: white;
        background-color: var(--primary-dark);
        border: none;
        border-radius: var(--radius-lg);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: all 0.2s;
    }

    .create-btn:hover {
        opacity: 0.9;
    }

    .create-btn:focus {
        outline: none;
        box-shadow: 0 0 0 2px var(--primary-dark);
    }

    body.dark .create-btn:focus {
        box-shadow: 0 0 0 2px var(--primary-dark);
    }

    .loading-icon {
        font-size: 1.25rem;
        margin-left: -0.25rem;
        margin-right: 0.5rem;
        display: none;
    }

    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: 1.5em 1.5em;
    }
</style>
<div class="create-project-container" id="projectModal">
        <form action="/add_project" method="POST">
        <!-- Background Overlay -->
        <div class="modal-overlay"></div>

        <!-- Modal Container -->
        <div class="modal-container">
            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title">Create New Project</h2>
                <button class="close-btn" type="button" onclick="toggleModal('projectModal', false)">
                    <span class="material-symbols-outlined close-icon">close</span>
                </button>
            </div>

            <!-- Modal Body - Form -->
            <div class="modal-body">
                <!-- Project Name -->
                <div class="form-group">
                    <label class="form-label" for="project-name">Project Name</label>
                    <input class="form-input" id="project-name" name="project-name"
                        placeholder="Enter a clear and concise project name" type="text" />
                    <p class="error-message">Project name is required.</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="project-budget">Budget</label>
                    <input class="form-input" id="project-budget" name="project-budget"
                        placeholder="Enter a clear and concise Budget" type="text" />
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-textarea" id="description" name="description"
                        placeholder="Add a detailed project description"></textarea>
                </div>

                <!-- Due Date & Status Row -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="due-date">Due Date</label>
                        <div class="date-input-wrapper">
                            <input class="date-input" id="due-date" name="due-date" placeholder="Select a date"
                                type="text" />
                            <div class="date-icon-container">
                                <span class="material-symbols-outlined date-icon">calendar_today</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="status">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <!-- Assign Members -->
                <div class="form-group">
                    <label class="form-label" for="assign-members">Assign Members</label>
                    <div class="members-input-container">
                        <span class="member-tag">
                            Alex Johnson
                            <button class="remove-member-btn" type="button">
                                <span class="material-symbols-outlined remove-icon">close</span>
                            </button>
                        </span>
                        <span class="member-tag">
                            Maria Garcia
                            <button class="remove-member-btn" type="button">
                                <span class="material-symbols-outlined remove-icon">close</span>
                            </button>
                        </span>
                        <input class="members-input" id="assign-members" placeholder="Search and add members..."
                            type="text" />
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button class="cancel-btn" type="button" onclick="toggleModal('projectModal', false)">Cancel</button>
                <button class="create-btn" type="submit">
                    <span class="material-symbols-outlined loading-icon">progress_activity</span>
                    Create Project
                </button>
            </div>
        </div>
    </form>
    </div>
